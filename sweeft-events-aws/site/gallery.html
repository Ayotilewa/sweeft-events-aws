<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gallery — Sweeft Events</title>
  <meta name="description" content="A peek at the weddings, social celebrations and corporate events Sweeft Events has brought to life." />
  <link rel="preload" href="fonts/bricolage-grotesque-latin-standard-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/manrope-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/manrope-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/cormorant-garamond-latin-500-italic.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/parisienne-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <script>document.documentElement.classList.add("js")</script>
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/inner.css" />
  <link rel="stylesheet" href="css/birthday.css" />
  <script src="js/birthday.js"></script>
</head>
<body data-page="gallery">
  <div id="nav-root"></div>

  <main>
    <section class="page-hero">
      <div class="page-hero-bg" data-parallax="-0.15"><img src="assets/hero-gallery.jpg" alt="" /></div>
      <p class="script reveal">Owambe, every time</p>
      <h1 class="display split" data-split style="--d:.15s">Moments we’ve <em class="serif-i">made</em></h1>
      <p class="sub reveal" style="--d:.5s">A peek at the weddings, social celebrations and corporate events we’ve had the joy of bringing to life.</p>
      <span class="scroll-cue" aria-hidden="true"></span>
    </section>

    <div class="g-filters">
      <div class="filters reveal" data-filters>
        <span class="filter-pill" aria-hidden="true"></span>
        <button class="is-active" data-filter="all">All</button>
        <button data-filter="weddings">Weddings</button>
        <button data-filter="social">Social</button>
        <button data-filter="corporate">Corporate</button>
        <button data-filter="decor">Decor</button>
      </div>
    </div>

    <section class="wrap featured-wrap">
      <figure class="featured tile-like rv" style="margin:0" data-lightbox-item>
        <div class="ph"><img src="assets/featured.jpg" alt="Lady Stark @40 — A Flowery 40 tablescape" /></div>
        <figcaption class="featured-cap"><small>FEATURED EVENT</small><strong>Lady Stark @40 — A Flowery 40</strong></figcaption>
      </figure>
    </section>

    <section class="wrap cols" data-masonry>
      <div class="col">
        <figure class="tile reveal" style="--h:416px" data-cat="weddings"><div class="ph"><img src="assets/g-omolade.png" alt="Omolade’s big day" /></div><figcaption><b>Omolade’s big day</b><small>WEDDINGS</small></figcaption></figure>
        <figure class="tile reveal" style="--h:200px" data-cat="social" data-video="owambe"><div class="ph"><img src="assets/g-owambe.png" alt="Owambe reception" /></div><span class="tile-play"><img src="assets/play-sm.svg" alt="" /></span><figcaption><b>Owambe reception</b><small>SOCIAL</small></figcaption></figure>
        <figure class="tile reveal" style="--h:300px" data-cat="social"><div class="ph"><img src="assets/gp-yeye.jpg" alt="Yeye Bolanle @60" /></div><figcaption><b>Yeye Bolanle @60</b><small>SOCIAL</small></figcaption></figure>
        <figure class="tile reveal" style="--h:200px" data-cat="decor"><div class="ph"><img src="assets/g-ladystark.png" alt="Lady Stark @40" /></div><figcaption><b>Lady Stark @40</b><small>DECOR</small></figcaption></figure>
      </div>
      <div class="col">
        <figure class="tile reveal" style="--h:200px;--d:.08s" data-cat="social" data-video="bola60"><div class="ph"><img src="assets/gp-bola60.png" alt="Bola @60" /></div><span class="tile-play"><img src="assets/play-sm.svg" alt="" /></span><figcaption><b>Bola @60</b><small>SOCIAL</small></figcaption></figure>
        <figure class="tile reveal" style="--h:416px;--d:.08s" data-cat="decor"><div class="ph"><img src="assets/gp-flowery40.png" alt="A Flowery 40" /></div><figcaption><b>A Flowery 40</b><small>DECOR</small></figcaption></figure>
        <figure class="tile reveal" style="--h:200px;--d:.08s" data-cat="social"><div class="ph"><img src="assets/gp-glam.png" alt="Birthday glam" /></div><figcaption><b>Birthday glam</b><small>SOCIAL</small></figcaption></figure>
        <figure class="tile reveal" style="--h:300px;--d:.08s" data-cat="weddings"><div class="ph"><img src="assets/gp-lades.png" alt="#LADEs4everADE" /></div><figcaption><b>#LADEs4everADE</b><small>WEDDINGS</small></figcaption></figure>
      </div>
      <div class="col">
        <figure class="tile reveal" style="--h:300px;--d:.16s" data-cat="corporate"><div class="ph"><img src="assets/gp-nsib.jpg" alt="NSIB conference" /></div><figcaption><b>NSIB conference</b><small>CORPORATE</small></figcaption></figure>
        <figure class="tile reveal" style="--h:416px;--d:.16s" data-cat="weddings"><div class="ph"><img src="assets/g-abiodun.png" alt="Abiodun &amp; Tosin" /></div><figcaption><b>Abiodun &amp; Tosin</b><small>WEDDINGS</small></figcaption></figure>
        <figure class="tile reveal" style="--h:200px;--d:.16s" data-cat="decor"><div class="ph"><img src="assets/g-balloon.png" alt="Balloon entrance" /></div><figcaption><b>Balloon entrance</b><small>DECOR</small></figcaption></figure>
        <figure class="tile reveal" style="--h:200px;--d:.16s" data-cat="decor" data-video="mk-decor"><div class="ph"><img src="assets/gp-mk.png" alt="MK decor reveal" /></div><span class="tile-play"><img src="assets/play-sm.svg" alt="" /></span><figcaption><b>MK decor reveal</b><small>DECOR</small></figcaption></figure>
      </div>
    </section>
    <div class="g-more reveal">
      <a class="btn btn-outline" href="https://www.instagram.com/sweeftevents_/" target="_blank" rel="noopener">Load more moments</a>
    </div>

    <section class="reels">
      <div class="wrap">
        <div class="reels-head">
          <div>
            <p class="script reveal">Straight from Instagram</p>
            <h2 class="display sec-title split" data-split>Watch the reels</h2>
          </div>
          <a class="btn btn-sand reveal" href="https://www.instagram.com/sweeftevents_/" target="_blank" rel="noopener">Follow @sweeftevents_</a>
        </div>
        <div class="reel-row">
          <a class="reel-card reveal" style="--d:0s" href="https://www.instagram.com/sweeftevents_/reels/" target="_blank" rel="noopener" data-video="mk-decor" aria-label="Watch a décor reveal reel"><div class="ph"><img src="assets/reel-1.png" alt="" /></div><span class="rp"><img src="assets/play-reel.svg" alt="" /></span><span class="handle"><img src="assets/dot-sand.svg" alt="" />@sweeftevents_</span></a>
          <a class="reel-card reveal" style="--d:.1s" href="https://www.instagram.com/sweeftevents_/reels/" target="_blank" rel="noopener" data-video="bola60" aria-label="Watch the Bola @60 reel"><div class="ph"><img src="assets/reel-2.png" alt="" /></div><span class="rp"><img src="assets/play-reel.svg" alt="" /></span><span class="handle"><img src="assets/dot-sand.svg" alt="" />@sweeftevents_</span></a>
          <a class="reel-card reveal" style="--d:.2s" href="https://www.instagram.com/sweeftevents_/reels/" target="_blank" rel="noopener" data-video="nsib" aria-label="Watch the NSIB conference reel"><div class="ph"><img src="assets/reel-3.png" alt="" /></div><span class="rp"><img src="assets/play-reel.svg" alt="" /></span><span class="handle"><img src="assets/dot-sand.svg" alt="" />@sweeftevents_</span></a>
          <a class="reel-card reveal" style="--d:.3s" href="https://www.instagram.com/sweeftevents_/reels/" target="_blank" rel="noopener" data-video="owambe" aria-label="Watch the owambe reel"><div class="ph"><img src="assets/reel-4.png" alt="" /></div><span class="rp"><img src="assets/play-reel.svg" alt="" /></span><span class="handle"><img src="assets/dot-sand.svg" alt="" />@sweeftevents_</span></a>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-root"></div>
  <script src="js/lenis.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
